# Connecticut. Facts and quotes from market/regulation.md §1 (NOT LEGAL ADVICE).
schema: nf.jurisdiction-rules/v1
jurisdiction: CT
name: Connecticut
rules:
  - id: ct-pa-25-113-neural-data
    title: Neural data is sensitive data under the Connecticut Data Privacy Act
    instrument: SB 1295, Public Act 25-113
    status_text: >-
      Signed by the Governor 24 Jun 2025. The CTDPA amendment sections carry "Effective July 1,
      2026" headers.
    effective_date: '2026-07-01'
    citation:
      source: cga.ct.gov bill status + PA 25-113 DOCX text
      grade: A
      definition: >-
        "'Neural data' means any information that is generated by measuring the activity of an
        individual's central nervous system."
      research_ref: market/regulation.md §1
    predicate:
      all:
        - attr: nervous_system
          eq: central
    obligations:
      - id: sensitive_data
        text: Neural data is item (G) of "sensitive data" under the Connecticut Data Privacy Act.
    review_status: draft
    notes: >-
      Central nervous system only. On a plain reading, peripheral signals such as EMG may fall
      outside it (market/regulation.md §1: interpretation, not legal advice).
