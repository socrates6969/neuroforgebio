# Colorado. Facts and quotes from market/regulation.md §1 (research summary, NOT LEGAL ADVICE).
schema: nf.jurisdiction-rules/v1
jurisdiction: CO
name: Colorado
rules:
  - id: co-hb24-1058-neural-data
    title: Neural data is sensitive data under the Colorado Privacy Act
    instrument: HB24-1058, "Protect Privacy of Biological Data"
    status_text: Signed 17 Apr 2024; effective 7 Aug 2024
    effective_date: '2024-08-07'
    citation:
      source: leg.colorado.gov/bills/hb24-1058
      grade: A
      definition: >-
        "information that is generated by the measurement of the activity of an individual's
        central or peripheral nervous systems and that can be processed by or with the assistance
        of a device."
      research_ref: market/regulation.md §1
    predicate:
      all:
        - attr: nervous_system
          in: [central, peripheral]
    assumptions:
      - >-
        "can be processed by or with the assistance of a device": every channel the platform
        stores is a device measurement, so this part of the definition is treated as met.
    obligations:
      - id: sensitive_data
        text: Neural data is added to "sensitive data" under the Colorado Privacy Act.
      - id: opt_in_consent
        text: Opt-in consent rules for sensitive data apply.
    review_status: draft
    notes: >-
      Open item in market/regulation.md: whether the sensitive-data consent rules apply at the
      controller-size thresholds relevant to startups.
