# California. Facts and quotes from market/regulation.md §1 and §6 (NOT LEGAL ADVICE).
schema: nf.jurisdiction-rules/v1
jurisdiction: CA
name: California
rules:
  - id: ca-sb-1223-neural-data
    title: Neural data is sensitive personal information under the CCPA/CPRA
    instrument: SB 1223 (CCPA amendment), Ch. 887
    status_text: Chaptered 28 Sep 2024, Ch. 887
    # market/regulation.md gives the chaptering date, not an effective date: none is invented here.
    effective_date: null
    citation:
      source: leginfo.legislature.ca.gov, SB1223
      grade: A
      definition: >-
        "information that is generated by measuring the activity of a consumer's central or
        peripheral nervous system, and that is not inferred from non-neural information"
      research_ref: market/regulation.md §1
    predicate:
      all:
        - attr: nervous_system
          in: [central, peripheral]
        - attr: derived_from_non_neural
          eq: false
    obligations:
      - id: sensitive_personal_information
        text: Neural data becomes "sensitive personal information" under the CCPA/CPRA.
      - id: limit_use
        text: >-
          Right to limit use (market/regulation.md §6 item 3: a "limit use" flag for California
          sensitive personal information).
        flag: limit_use
    review_status: draft
