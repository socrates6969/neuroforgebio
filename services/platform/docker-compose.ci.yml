# CI stack for services/platform integration tests (BUILD-GUIDE 2.1): Postgres 16 + an S3-compatible store.
# CI-only: not started on the dev PC (RAM). Images are pinned by digest (supply chain, BLUEPRINT §8.7).
#   docker compose -f services/platform/docker-compose.ci.yml up -d --wait
#   NF_TEST_DATABASE_URL=postgresql://postgres:ci-only@127.0.0.1:55432/postgres \
#   NF_TEST_S3_ENDPOINT=http://127.0.0.1:59000 uv run pytest services/platform -m "postgres or integration"
#   docker compose -f services/platform/docker-compose.ci.yml down -v
# The credentials below are throwaway values for an ephemeral CI container, not secrets.
#
# MinIO: the upstream images (minio/minio, quay.io/minio/minio) are no longer publicly pullable
# (checked 2026-09-26: registry 401/404). bitnamilegacy/minio is a frozen community build
# (2025.7.23) and is used here ONLY as a disposable test double for S3 + Object Lock. Replace it when
# the storage decision for dev/on-prem is made (m2-data / queen). M2-REVIEW: approved for CI tests
# with synthetic data only, never in a staging/prod compose file; listed in the SBOM as
# nfb:supportLevel=unmaintained (security/sbom-ci-images.json); replace before M5 closes
# (docs/security/SEC-COVERAGE.md, known gaps).
# Production object storage is the cloud provider's S3 (D4), never MinIO: docs/security/object-storage.md.
name: nf-platform-ci

services:
  postgres:
    # postgres:16-alpine
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ci-only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # bitnamilegacy/minio:2025.7.23-debian-12-r5
    image: bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:59000:9000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30
