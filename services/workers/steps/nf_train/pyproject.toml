# nf-train: toy decoder training with an optional SISA sharded mode (BUILD-GUIDE 6.4; Bourtoule et al.,
# "Machine Unlearning", arXiv:1912.03817). NOT certified unlearning (docs/features/sisa.md).
# Tested from the repo root (root pyproject.toml adds this directory to pytest's pythonpath); the tests live
# in services/platform/tests/sisa (one Postgres cluster per session). The pure core (decoder, sisa, toydata)
# needs only NumPy; nf_train.platform is the worker-side glue to nf_platform (never its API layer:
# services/workers/.importlinter).
[project]
name = "nf-train"
version = "0.1.0"
description = "Toy EEG decoder (NumPy logistic regression on band-power features) with SISA shard/slice checkpoints."
requires-python = "==3.12.*"
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
platform = ["nf-platform"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nf_train"]
