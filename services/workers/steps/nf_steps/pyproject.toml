# nf-steps: step library v1 wrapping MNE (BUILD-GUIDE 3.4, BLUEPRINT §3.5). Analysis artifacts only: no step
# produces or sends anything to acquisition or stimulation hardware (SEC-090).
# Tested from the repo root (root pyproject.toml adds this directory to pytest's pythonpath/testpaths). The
# container image for steps installs this package; its entrypoint is `python -m nf_steps run ...`.
[project]
name = "nf-steps"
version = "1.0.0"
description = "Versioned, parameter-explicit EEG preprocessing steps (filter, notch, re-reference, resample, bad channels, ICA, epochs, band power) wrapping MNE-Python."
requires-python = "==3.12.*"
dependencies = [
  "mne==1.13.2",
  "numpy>=2.1,<3",
  "pydantic==2.13.5",
  "scipy==1.18.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nf_steps", "nf_steps.pipelines"]

[tool.setuptools.package-data]
"nf_steps.pipelines" = ["*.json"]
