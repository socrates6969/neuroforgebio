# nf-channel-estimator: distinct-channel count estimator for projected-field maps (research use only).
# Tested from the repo root (root pyproject.toml adds this directory to pytest's pythonpath/testpaths);
# this file only records the package metadata for a later workspace/packaging step.
[project]
name = "nf-channel-estimator"
version = "0.1.0"
description = "Distinct-channel counts, clustering and attrition for projected-field maps. Research use only; not a medical device."
requires-python = "==3.12.*"
dependencies = ["numpy>=2.1,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nf_channel_estimator", "nf_channel_estimator.reference_data"]

# The reference tables are third-party figure data (CC BY-NC-ND 4.0): never packaged.
# They stay in the private source tree for tests (THIRD_PARTY_NOTICE.md, tests/test_ce_release_guard.py).
[tool.setuptools.exclude-package-data]
"*" = ["greenspon2025_*"]
