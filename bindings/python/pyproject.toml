[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "neuroforge"
dynamic = ["version"]
description = "Python SDK for reproducible neural-data pipelines with provenance (on the nf-core Rust core)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Marius R. Carlsson" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=2.1,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
# streaming to IngestService (gRPC)
stream = ["grpcio>=1.70,<2"]
# LSL inlet bridge (SEC-091: inlet only)
lsl = ["pylsl>=1.17,<2"]
# MNE Raw interop
mne = ["mne>=1.10,<2"]

[tool.maturin]
module-name = "neuroforge._native"
python-source = "python"
features = []
# abi3 (py3.12+) wheels; release builds only in CI (.github/workflows/sdk-wheels.yml).
