# Console browser tests (BUILD-GUIDE 3.8). Dispatch only. The mock IdP is not deployed.
name: console-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm --filter @nf/console build
      - run: pnpm --filter @nf/console exec playwright install --with-deps chromium
      - run: pnpm --filter @nf/console test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: console-e2e
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 14
          if-no-files-found: ignore
