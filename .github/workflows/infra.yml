# OpenTofu checks for infra/. Dispatch only. Nothing here applies a plan (ADR 0004).
name: infra

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.10.6
      - name: Format, validate, test, and reject literal secret assignments
        run: |
          if grep -RInE '^[[:space:]]*(password|secret)[[:space:]]*=[[:space:]]*"' infra; then
            echo "literal password or secret assignment in infra/"
            exit 1
          fi
          tofu fmt -check -recursive infra
          tofu -chdir=infra/envs/dev init -backend=false
          tofu -chdir=infra/envs/dev validate
          tofu -chdir=infra/envs/dev test
          tofu -chdir=infra/modules/phi-guard init -backend=false
          tofu -chdir=infra/modules/phi-guard test
