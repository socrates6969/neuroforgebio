# Multiverse study (BUILD-GUIDE 3.9). Dispatch only. Downloads stay behind confirm_download.
name: multiverse-study

on:
  workflow_dispatch:
    inputs:
      confirm_download:
        description: Type yes to download the selected public datasets
        required: true
        default: 'no'
        type: string

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  study:
    runs-on: ubuntu-latest
    environment: study
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
      - run: uv sync --locked
      - name: Validate, and fetch only when confirm_download is yes
        env:
          CONFIRM: ${{ inputs.confirm_download }}
          NF_API_URL: ${{ vars.NF_STUDY_API_URL }}
          NF_API_TOKEN: ${{ secrets.NF_STUDY_API_TOKEN }}
        run: |
          uv run --locked python research/multiverse/run_study.py validate
          if [ "$CONFIRM" = "yes" ]; then
            NF_STUDY_ALLOW_DOWNLOAD=true uv run --locked python research/multiverse/run_study.py fetch --out study-out
          else
            echo "confirm_download is not yes; fetch skipped"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: multiverse-study
          path: study-out
          retention-days: 14
          if-no-files-found: ignore
