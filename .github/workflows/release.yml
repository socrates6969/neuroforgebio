# Signs the two website bundles. Dispatch only; never publishes a release (SEC-081/082/083).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in the bundle file names
        required: true
        type: string

permissions:
  contents: read

env:
  CI: 'true'
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack both theme bundles
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p out
          for t in clinical cosmos; do
            node tools/dev/tasks.mjs build-web "$t"
            tar -C "apps/web/dist/$t" -czf "out/nfb-site-$t-$VERSION.tar.gz" .
          done
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: out
          retention-days: 14

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: One CycloneDX document per bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pnpm install --dir tools/sbom-cdxgen --ignore-workspace --frozen-lockfile --ignore-scripts
          mkdir -p sbom-in
          for t in clinical cosmos; do
            node tools/dev/tasks.mjs build-web "$t"
            tools/sbom-cdxgen/node_modules/.bin/cdxgen --spec-version 1.6 --exclude "tools/sbom-cdxgen/**" -o "sbom-in/nfb-site-$t-$VERSION.cdx.json" "apps/web/dist/$t"
            node tools/sbom-props/cli.mjs add "sbom-in/nfb-site-$t-$VERSION.cdx.json" --overrides security/support-levels.json
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: sbom-in
          retention-days: 14

  sign:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sbom
          path: sbom-in
      - name: Check bundles, accept only the two SBOMs, sign
        env:
          VERSION: ${{ inputs.version }}
        run: |
          (cd out && sha256sum -c SHA256SUMS)
          expected=$(printf '%s\n' "nfb-site-clinical-$VERSION.cdx.json" "nfb-site-cosmos-$VERSION.cdx.json" | sort)
          got=$(cd sbom-in && find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$got" != "$expected" ]; then
            echo "SBOM names are not the two bundle documents"
            printf '%s\n' "$got"
            exit 1
          fi
          for f in "nfb-site-clinical-$VERSION.cdx.json" "nfb-site-cosmos-$VERSION.cdx.json"; do
            if [ ! -e "out/$f" ]; then
              cp "sbom-in/$f" "out/$f"
            else
              echo "refusing to replace out/$f"
              exit 1
            fi
          done
          (cd out && sha256sum * > SHA256SUMS)
          for f in out/*; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed
          path: out
          retention-days: 90

  verify:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signed
          path: out
      - name: Verify signatures and reject a tampered copy
        env:
          REPO: ${{ github.repository }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          SIGNER: ${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          shopt -s nullglob
          for f in out/*; do
            case "$f" in
              *.bundle) continue ;;
            esac
            [ -f "$f.bundle" ] || continue
            cosign verify-blob --bundle "$f.bundle" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$SIGNER"
            cp "$f" "$f.tampered"
            printf x >> "$f.tampered"
            if cosign verify-blob --bundle "$f.bundle" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f.tampered"; then
              echo "tampered file verified; refusing"
              exit 1
            fi
          done
