# cargo-deny policy for the Rust workspace (BUILD-GUIDE 4.2: "cargo deny/audit are clean").
# Run in CI: `cargo deny --all-features check` (not installed on the dev PC; CI-only).
# Kept at the repository root on purpose: the SEC-091 ban list below names device-access crates,
# and tools/hw-guard scans core/, bindings/ and sdk/ for exactly those names.

[graph]
all-features = true

[advisories]
# RustSec advisory DB; any vulnerability or yanked crate fails the check.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licences only; the workspace crates themselves are proprietary until D6.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# SEC-091: the SDK core never opens device handles. These crates must never enter the graph.
deny = [
  { name = "serialport" },
  { name = "tokio-serial" },
  { name = "mio-serial" },
  { name = "serial2" },
  { name = "rusb" },
  { name = "libusb1-sys" },
  { name = "nusb" },
  { name = "hidapi" },
  { name = "btleplug" },
  { name = "bluer" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
