[package]
name = "arena-core"
version = "0.1.0"
description = "Decoder Arena: leak-proof, in-browser decoder evaluation (ridge, Kalman, GRU-style reservoir), metrics and planted-leak control."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasm-bindgen and getrandom/js only compile in on the wasm32 target; native builds/tests
# never pull them in. getrandom's "js" feature calls the browser's window.crypto via the
# wasm-bindgen shim for randomness -- a JS call, not a network fetch or a build script.
# Pinned to =0.2.129 to match the installed wasm-bindgen-cli exactly (web-queen/lead, 2026-09-27).
wasm-bindgen = { version = "=0.2.129", optional = true }
getrandom = { version = "0.2", optional = true, features = ["js"] }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:getrandom"]

[dev-dependencies]
