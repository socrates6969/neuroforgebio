name: ad-hoc-runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: npx -y @cyclonedx/cdxgen@12.8.4 -o sbom.json .
      - run: |
          npx --yes left-pad@1.3.0
          npx -q -y left-pad@1.3.0
          npx @cyclonedx/cdxgen@12.8.4 -o sbom.json .
          npx prettier --check .
          pnpm dlx cowsay@1.6.0 hi
          pnpx cowsay@1.6.0 hi
          npm exec -- cowsay@1.6.0 hi
          yarn dlx cowsay@1.6.0 hi
          bunx cowsay@1.6.0 hi
          echo ok && npx cowsay hi
      # allowed: bins installed from a lockfile; the word npx in a comment or inside another word
      - run: pnpm exec cdxgen -o sbom.json .
      - run: tools/sbom-cdxgen/node_modules/.bin/cdxgen -o sbom.json . # not npx
      - run: echo "snpx-tool unpnpx"
