components:
  responses:
    Forbidden:
      content: &id001
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: Authenticated but not allowed (role, scope, tenant, quota).
    InternalError:
      content: *id001
      description: Unexpected error (a fixed body; details stay in the server log).
    Invalid:
      content: *id001
      description: The request is not valid.
    NotFound:
      content: *id001
      description: Not found (also for resources of another tenant).
    OtherError:
      content: *id001
      description: Any other error status, e.g. 409 conflict, 410 gone, 413 too large.
    TooManyRequests:
      content: *id001
      description: Rate limit or quota exceeded.
      headers:
        Retry-After:
          schema:
            minimum: 1
            type: integer
    Unauthorized:
      content: *id001
      description: Missing, invalid, expired or revoked credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
  schemas:
    AcceptedOut:
      properties:
        status:
          const: pending-confirmation
          default: pending-confirmation
          title: Status
          type: string
      title: AcceptedOut
      type: object
    ApiKeyIn:
      properties:
        expires_in_days:
          anyOf:
          - type: integer
          - type: 'null'
          description: 1..365, default 90
          title: Expires In Days
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        roles:
          items:
            type: string
          minItems: 1
          title: Roles
          type: array
        scopes:
          items:
            type: string
          minItems: 1
          title: Scopes
          type: array
      required:
      - name
      - roles
      - scopes
      title: ApiKeyIn
      type: object
    ApiKeyIssued:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        key:
          description: Shown once. Store it in a secret manager.
          title: Key
          type: string
        name:
          title: Name
          type: string
        owner_id:
          title: Owner Id
          type: string
        public_id:
          title: Public Id
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        roles:
          items:
            type: string
          title: Roles
          type: array
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
      - id
      - public_id
      - name
      - owner_id
      - roles
      - scopes
      - created_at
      - expires_at
      - revoked_at
      - key
      title: ApiKeyIssued
      type: object
    ApiKeyOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        owner_id:
          title: Owner Id
          type: string
        public_id:
          title: Public Id
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        roles:
          items:
            type: string
          title: Roles
          type: array
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
