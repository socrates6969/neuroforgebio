  securitySchemes:
    apiKey:
      bearerFormat: nfb_live_<public id>_<secret>
      description: Scoped, expiring API key (SEC-014). Revocation is effective at once for new requests
        and within 60 s for open streams (SEC-017).
      scheme: bearer
      type: http
    oidc:
      description: 'User access token from the identity provider (Authorization: Bearer).'
      openIdConnectUrl: https://id.example.invalid/.well-known/openid-configuration
      type: openIdConnect
info:
  description: 'Platform API v1. Data flows device -> SDK -> platform only: no operation, event or field
    sends anything to acquisition hardware (SEC-090). Errors are RFC 9457 application/problem+json. Only
    additive changes within v1; deprecations carry Deprecation and Sunset headers.'
  title: Platform API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/api-keys:
    get:
      operationId: listApiKeys
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyOut'
                title: Response Listapikeys
                type: array
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      summary: List Api Keys
      x-nf-action: apikey:read
    post:
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      summary: Create Api Key
      x-nf-action: apikey:create
  /v1/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      parameters:
      - in: path
        name: key_id
        required: true
        schema:
          format: uuid
          title: Key Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      summary: Revoke Api Key
      x-nf-action: apikey:revoke
  /v1/artifacts/{node_id}/governance:
    get:
      operationId: getArtifactGovernance
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          format: uuid
          title: Node Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      - apiKey: []
      summary: Get Artifact Governance
      x-nf-action: governance:read
      x-nf-api-key-scope: metadata:read
    put:
      operationId: putArtifactGovernance
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          format: uuid
          title: Node Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactGovIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      summary: Put Artifact Governance
      x-nf-action: governance:write
  /v1/audit/batches:
    get:
      operationId: listAuditBatches
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
