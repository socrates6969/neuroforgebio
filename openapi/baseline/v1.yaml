webhooks:
  runFinished:
    post:
      description: Sent when a pipeline run reaches a terminal state. Verify NF-Webhook-Signature over
        the raw body before parsing (SEC-045).
      operationId: runFinished
      parameters:
      - in: header
        name: NF-Webhook-Id
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: NF-Webhook-Timestamp
        required: true
        schema:
          type: integer
      - description: t=<unix seconds>,v1=<hex HMAC-SHA-256 of '<t>.' + body>[,v1=...] (one v1 per valid
          signing secret)
        in: header
        name: NF-Webhook-Signature
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunFinishedEvent'
        required: true
      responses:
        2XX:
          description: Received. Anything else is retried with backoff.
      summary: run.finished event
