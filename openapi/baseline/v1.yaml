        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      summary: List Audit Batches
      x-nf-action: audit:read
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      parameters:
      - in: query
        name: after_seq
        required: false
        schema:
          default: 0
          minimum: 0
          title: After Seq
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuditEventOut'
                title: Response Listauditevents
                type: array
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      summary: List Audit Events
      x-nf-action: audit:read
  /v1/classifications:
    get:
      description: 'Classification per channel of a recording (plus the recording''s strictest summary),
        or per

        derived artifact (``node_id``, inherited through the lineage).'
      operationId: classifications
      parameters:
      - in: query
        name: recording_id
