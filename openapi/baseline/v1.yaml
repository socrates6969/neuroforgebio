  /v1/recordings/{recording_id}/data:
    get:
      description: 'Read the window ``[start, end)`` seconds of a recording (step 2.4).


        Decrypted server-side with the subject''s DEK. Response format ``nf-window/1`` (see

        ``nf_platform.ingest.recording_store``): a header (channels, units, scale/offset, dtype,

        shape [channels, samples], level, decimation, sfreq, start_s, chunk_id) plus the samples,

        as JSON (``format=json``, at most ``window_json_max_values`` values) or as

        ``application/vnd.nf.window.v1`` bytes (``format=binary``, at most ``window_max_values``).

        Larger windows get 422 ``window-too-large``: use a pyramid ``level`` or a shorter window.

        Quarantined recordings: 403 except for owner/admin/data-steward.'
      operationId: readRecordingData
      parameters:
      - in: path
        name: recording_id
        required: true
        schema:
          format: uuid
          title: Recording Id
          type: string
      - description: window start [s]
        in: query
        name: start
        required: true
        schema:
          description: window start [s]
          minimum: 0
          title: Start
          type: number
      - description: window end [s], exclusive
        in: query
        name: end
        required: true
        schema:
          description: window end [s], exclusive
          exclusiveMinimum: 0
          title: End
          type: number
      - description: comma-separated names or indices
        in: query
        name: channels
        required: false
        schema:
          anyOf:
          - maxLength: 65536
            type: string
          - type: 'null'
          description: comma-separated names or indices
          title: Channels
      - in: query
        name: level
        required: false
        schema:
          default: 0
          maximum: 11
          minimum: 0
          title: Level
          type: integer
      - in: query
        name: kind
        required: false
        schema:
          default: mean
          enum:
          - mean
          - min
          - max
          title: Kind
          type: string
      - in: query
        name: format
        required: false
        schema:
          default: json
          enum:
          - json
          - binary
          title: Format
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowJsonOut'
            application/vnd.nf.window.v1:
              schema:
                format: binary
                type: string
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/OtherError'
      security:
      - oidc: []
      - apiKey: []
      summary: Read Recording Data
      x-nf-action: signal:read
      x-nf-api-key-scope: data:read
