<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neural Cosmos Hero</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05010F}
  #stage{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 46%, #150a33 0%, #0a0420 45%, #05010F 80%)}
  #stage canvas{display:block;width:100%;height:100%}
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#8B5CF6;font:500 14px system-ui,sans-serif;opacity:.6}
  #stage.nogl #fallback{display:flex}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Glowing three-dimensional point cloud shaped like a brain, in violet, cyan and pink, slowly rotating in dark space while bright pulses travel along short arcs between points.">
  <div id="fallback" aria-hidden="true">NeuroForge</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const stage = document.getElementById('stage');
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'low-power' });
} catch (e) {
  stage.classList.add('nogl');
}

if (renderer) main();

function main() {
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.domElement.setAttribute('aria-hidden', 'true');
  stage.appendChild(renderer.domElement);

  const FOV = 38;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 60);
  const group = new THREE.Group();
  group.rotation.x = 0.18;
  scene.add(group);

  // ---------- seeded helpers ----------
  let seed = 1337;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const h3 = (x, y, z) => {
    let n = Math.imul(x, 73856093) ^ Math.imul(y, 19349663) ^ Math.imul(z, 83492791);
    n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16; return (n >>> 0) / 4294967295;
  };
  const vn = (x, y, z) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let xf = x - xi, yf = y - yi, zf = z - zi;
    xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
    const l = (a, b, t) => a + (b - a) * t;
    return l(
      l(l(h3(xi, yi, zi), h3(xi + 1, yi, zi), xf), l(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), xf), yf),
      l(l(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), xf), l(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), xf), yf),
      zf);
  };
  const fbm = (x, y, z) => vn(x, y, z) * 0.55 + vn(x * 2.03, y * 2.03, z * 2.03) * 0.3 + vn(x * 4.1, y * 4.1, z * 4.1) * 0.15;
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const VIO = new THREE.Color('#8B5CF6'), CYA = new THREE.Color('#22D3EE'), PNK = new THREE.Color('#F472B6');
  const tmp = new THREE.Color();

  const P = [], COL = [], SIZE = [], SEED = [];
  const cortexIdx = [];
  function push(x, y, z, col, size) {
    P.push(x, y, z); COL.push(col.r, col.g, col.b); SIZE.push(size); SEED.push(rnd());
  }
  function paletteAt(x, y, z, bright) {
    tmp.copy(PNK).lerp(VIO, ss(-0.9, 0.05, z)).lerp(CYA, ss(0.15, 1.0, z) * 0.9);
    tmp.lerp(CYA, ss(0.2, 0.7, y) * 0.15);
    return tmp.multiplyScalar(bright);
  }

  // ---------- cortex: two hemispheres ----------
  const HEMI_OFF = 0.24;
  for (let i = 0; i < 9000; i++) {
    const side = i % 2 ? 1 : -1;
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const nx = s * Math.cos(th), ny = u, nz = s * Math.sin(th);
    let x = nx * 0.55, y = ny * (ny > 0 ? 0.66 : 0.46), z = nz * 1.02;
    if (nx * side < 0) x *= 0.35;                 // flat medial wall
    const front = Math.max(0, z);
    y -= front * front * 0.12; x *= 1 - front * 0.1;
    if (ny < 0 && nx * side > 0) {                // temporal lobe bulge
      const tz = Math.exp(-((z - 0.2) ** 2) / 0.12);
      y -= 0.14 * tz * (-ny);
    }
    const f = fbm(x * 3.6 + side * 9.1, y * 3.6, z * 3.6);
    const ridge = Math.abs(Math.sin(f * 20.0));  // 0 along sulci, 1 on gyral crowns
    // concentrate samples on gyral crowns so the folds read as lines of light
    if (rnd() > 0.04 + 0.96 * ridge * ridge * ridge) { i--; continue; }
    const d = 0.9 + 0.1 * ridge;
    x *= d; y *= d; z *= d; x += side * HEMI_OFF;
    const bright = 0.25 + 0.75 * ridge * ridge;
    cortexIdx.push(P.length / 3);
    push(x, y + 0.08, z, paletteAt(x, y, z, bright), 0.016 + 0.014 * ridge);
  }
  // ---------- cerebellum ----------
  for (let i = 0; i < 1100; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const x = s * Math.cos(th) * 0.5, y = u * 0.22 - 0.46, z = s * Math.sin(th) * 0.3 - 0.66;
    const fol = Math.abs(Math.sin((y + 0.46) * 60 + Math.cos(x * 6) * 0.8));
    push(x, y, z, paletteAt(x, y, z - 0.2, 0.25 + 0.6 * fol), 0.018 + 0.012 * fol);
  }
  // ---------- brainstem ----------
  for (let i = 0; i < 350; i++) {
    const a = rnd() * Math.PI * 2, t = rnd();
    const r = 0.11 * (1 - t * 0.25);
    const x = Math.cos(a) * r, z = Math.sin(a) * r - 0.3 - t * 0.12, y = -0.3 - t * 0.62;
    push(x, y, z, paletteAt(x, y, -0.5, 0.35), 0.018);
  }
  // ---------- interior haze ----------
  for (let i = 0; i < 700; i++) {
    const side = rnd() < 0.5 ? -1 : 1;
    let x, y, z;
    do { x = rnd() * 2 - 1; y = rnd() * 2 - 1; z = rnd() * 2 - 1; } while (x * x + y * y + z * z > 1);
    x = x * 0.42 + side * HEMI_OFF; y = y * 0.48; z = z * 0.85;
    push(x, y + 0.06, z, paletteAt(x, y, z, 0.22), 0.02);
  }
  // ---------- distant dust ----------
  for (let i = 0; i < 520; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 4 + rnd() * 6;
    const c = [VIO, CYA, PNK][i % 3];
    push(s * Math.cos(th) * r, u * r * 0.6, s * Math.sin(th) * r, tmp.copy(c).multiplyScalar(0.25 + rnd() * 0.35), 0.03 + rnd() * 0.03);
  }

  const vert = `
    attribute float aSize; attribute vec3 aColor; attribute float aSeed;
    uniform float uTime; uniform float uScale; uniform float uTwinkle;
    varying vec3 vColor; varying float vA;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float tw = 1.0 - uTwinkle + uTwinkle * (0.55 + 0.45 * sin(uTime * 1.4 + aSeed * 6.2831));
      vColor = aColor; vA = tw;
      gl_PointSize = max(1.0, aSize * uScale / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`;
  const frag = `
    uniform float uOpacity;
    varying vec3 vColor; varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float a = smoothstep(0.5, 0.0, d);
      a = a * a * (0.6 + 0.4 * smoothstep(0.22, 0.0, d));
      gl_FragColor = vec4(vColor, a * vA * uOpacity);
    }`;
  const uniforms = { uTime: { value: 0 }, uScale: { value: 500 }, uTwinkle: { value: 1 }, uOpacity: { value: 0.72 } };
  const mat = new THREE.ShaderMaterial({ uniforms, vertexShader: vert, fragmentShader: frag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('aColor', new THREE.Float32BufferAttribute(COL, 3));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(SIZE, 1));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(SEED, 1));
  group.add(new THREE.Points(geo, mat));
  const posArr = geo.attributes.position.array;

  // ---------- firing pulses ----------
  const NP = 8, SEG = 40;
  const pulseUniforms = { uTime: uniforms.uTime, uScale: uniforms.uScale, uTwinkle: { value: 0 }, uOpacity: { value: 1 } };
  const pulseMat = new THREE.ShaderMaterial({ uniforms: pulseUniforms, vertexShader: vert, fragmentShader: frag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(NP * 2 * 3), pCol = new Float32Array(NP * 2 * 3), pSize = new Float32Array(NP * 2), pSeed = new Float32Array(NP * 2);
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
  pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
  pGeo.setAttribute('aSeed', new THREE.BufferAttribute(pSeed, 1));
  const pPoints = new THREE.Points(pGeo, pulseMat);
  pPoints.frustumCulled = false;
  group.add(pPoints);

  const pulses = [];
  const PCOLS = [CYA, PNK, new THREE.Color('#C4B5FD'), CYA];
  for (let k = 0; k < NP; k++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SEG * 3), 3));
    const m = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false });
    const line = new THREE.Line(g, m);
    line.frustumCulled = false; line.visible = false;
    group.add(line);
    pulses.push({ line, g, m, active: false, p: 0, dur: 1, a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), col: CYA });
  }
  const va = new THREE.Vector3(), vb = new THREE.Vector3();
  function bezierAt(q, t, out) {
    const u = 1 - t;
    return out.set(
      u * u * q.a.x + 2 * u * t * q.c.x + t * t * q.b.x,
      u * u * q.a.y + 2 * u * t * q.c.y + t * t * q.b.y,
      u * u * q.a.z + 2 * u * t * q.c.z + t * t * q.b.z);
  }
  function spawn(q, p0) {
    const i = cortexIdx[(rnd() * cortexIdx.length) | 0];
    va.fromArray(posArr, i * 3);
    let found = false;
    for (let tries = 0; tries < 30 && !found; tries++) {
      const j = cortexIdx[(rnd() * cortexIdx.length) | 0];
      vb.fromArray(posArr, j * 3);
      const d = va.distanceTo(vb);
      if (d > 0.3 && d < 0.8) found = true;
    }
    if (!found) return;
    q.a.copy(va); q.b.copy(vb);
    q.c.copy(va).add(vb).multiplyScalar(0.5);
    q.c.multiplyScalar(1.0 + 0.35 * (0.6 + rnd() * 0.4) / Math.max(0.4, q.c.length()));
    const arr = q.g.attributes.position.array, v = new THREE.Vector3();
    for (let s = 0; s < SEG; s++) { bezierAt(q, s / (SEG - 1), v); arr[s * 3] = v.x; arr[s * 3 + 1] = v.y; arr[s * 3 + 2] = v.z; }
    q.g.attributes.position.needsUpdate = true;
    q.col = PCOLS[(rnd() * PCOLS.length) | 0];
    q.m.color.copy(q.col);
    q.dur = 0.9 + rnd() * 0.7; q.p = p0 || 0; q.active = true; q.line.visible = true;
  }
  const hv = new THREE.Vector3();
  function updatePulses(dt) {
    for (let k = 0; k < NP; k++) {
      const q = pulses[k];
      const hi = k * 2, fi = k * 2 + 1;
      if (!q.active) { pSize[hi] = 0; pSize[fi] = 0; continue; }
      q.p += dt / q.dur;
      const TAIL = 0.35;
      if (q.p > 1 + TAIL + 0.4) { q.active = false; q.line.visible = false; pSize[hi] = 0; pSize[fi] = 0; continue; }
      const head = Math.min(1, q.p), tail = Math.max(0, q.p - TAIL);
      const s0 = Math.floor(tail * (SEG - 1)), s1 = Math.ceil(head * (SEG - 1));
      q.g.setDrawRange(s0, Math.max(0, s1 - s0 + 1));
      q.m.opacity = 0.95 * (q.p < 1 ? 1 : Math.max(0, 1 - (q.p - 1) / (TAIL + 0.4)));
      bezierAt(q, head, hv);
      pPos[hi * 3] = hv.x; pPos[hi * 3 + 1] = hv.y; pPos[hi * 3 + 2] = hv.z;
      pCol[hi * 3] = q.col.r; pCol[hi * 3 + 1] = q.col.g; pCol[hi * 3 + 2] = q.col.b;
      pSize[hi] = q.p < 1 ? 0.13 : 0;
      // landing flash at target
      pPos[fi * 3] = q.b.x; pPos[fi * 3 + 1] = q.b.y; pPos[fi * 3 + 2] = q.b.z;
      pCol[fi * 3] = 1; pCol[fi * 3 + 1] = 1; pCol[fi * 3 + 2] = 1;
      const fl = q.p >= 1 ? Math.max(0, 1 - (q.p - 1) / 0.5) : 0;
      pSize[fi] = 0.22 * fl;
      if (q.p >= 1) { pCol[fi * 3] = q.col.r * 0.6 + 0.4; pCol[fi * 3 + 1] = q.col.g * 0.6 + 0.4; pCol[fi * 3 + 2] = q.col.b * 0.6 + 0.4; }
    }
    pGeo.attributes.position.needsUpdate = true;
    pGeo.attributes.aColor.needsUpdate = true;
    pGeo.attributes.aSize.needsUpdate = true;
  }

  // ---------- sizing ----------
  let baseDist = 4.2;
  function resize() {
    const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    const asp = w / h;
    baseDist = asp >= 1.1 ? 3.25 : 3.25 * Math.min(2.2, 1.15 / asp);
    uniforms.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(FOV) / 2));
  }

  // ---------- interaction ----------
  let tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener('pointermove', (e) => {
    tx = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
    ty = (e.clientY / Math.max(1, window.innerHeight)) * 2 - 1;
  }, { passive: true });
  document.addEventListener('pointerleave', () => { tx = 0; ty = 0; });

  let time = 0, spawnIn = 0.3;
  function place() {
    camera.position.set(cx * 0.55, 0.28 - cy * 0.35, baseDist);
    camera.lookAt(0, -0.06, 0);
  }
  function step(dt) {
    time += dt;
    uniforms.uTime.value = time;
    group.rotation.y += dt * 0.075;
    cx += (tx - cx) * Math.min(1, dt * 2.2);
    cy += (ty - cy) * Math.min(1, dt * 2.2);
    place();
    spawnIn -= dt;
    if (spawnIn <= 0) {
      const free = pulses.find((q) => !q.active);
      if (free) spawn(free);
      spawnIn = 0.22 + rnd() * 0.7;
    }
    updatePulses(dt);
    renderer.render(scene, camera);
  }
  function renderStatic() {
    group.rotation.y = -0.55; time = 2.0; uniforms.uTime.value = time;
    pulses.forEach((q, k) => { if (k < 5) spawn(q, 0.55 + k * 0.08); });
    updatePulses(0);
    cx = cy = 0; place();
    renderer.render(scene, camera);
  }

  // ---------- loop control ----------
  let raf = 0, running = false, last = 0, inView = true;
  const frame = (now) => { const dt = Math.min(0.05, (now - last) / 1000) || 0; last = now; step(dt); raf = requestAnimationFrame(frame); };
  function start() { if (running || RM.matches || document.hidden || !inView) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));
  const onRM = () => { if (RM.matches) { stop(); renderStatic(); } else start(); };
  if (RM.addEventListener) RM.addEventListener('change', onRM); else if (RM.addListener) RM.addListener(onRM);
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { inView = es[0].isIntersecting; inView ? start() : stop(); }).observe(stage);
  const onResize = () => { resize(); if (!running) { place(); renderer.render(scene, camera); } };
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(stage); else window.addEventListener('resize', onResize);

  resize();
  group.rotation.y = -0.55;
  if (RM.matches) renderStatic(); else { place(); renderer.render(scene, camera); start(); }
}
</script>
</body>
</html>
